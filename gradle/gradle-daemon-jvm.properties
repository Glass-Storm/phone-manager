# Gradle daemon JVM criteria (Gradle 8.8+).
#
# Pins the build daemon to a JDK 21, so a bare `./gradlew <task>` resolves a
# Java 21 daemon instead of the Java 25 on this host's PATH (Gradle 8.13 cannot
# run on Java 25 and fails with the opaque "What went wrong: 25.0.4.1").
#
# This replaces the machine-specific JAVA_HOME preamble as the *only* line of
# defence: CI provisions Temurin 21 (auto-detected), and this host points Gradle
# at its JDK 21 through `~/.gradle/gradle.properties`
# (`org.gradle.java.installations.paths=/home/chaos/.jdk/jdk-21.0.12.1+1`).
#
# Keeping this criteria in the repo is portable: it requests a *version*, not a
# machine path, so no other machine or CI job inherits a hard-coded location.
toolchainVersion=21
