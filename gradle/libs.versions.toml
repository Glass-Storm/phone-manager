[versions]
agp = "8.13.0"
kotlin = "2.1.0"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
lifecycle = "2.8.7"
coroutines = "1.9.0"
junit = "4.13.2"
androidxTestCore = "1.7.0"
robolectric = "4.16.1"
truth = "1.4.5"
turbine = "1.2.1"
ktlint = "14.2.0"
protobufPlugin = "0.10.0"
protoc = "3.25.9"
protobufJavaLite = "3.25.9"
protobufKotlinLite = "3.25.9"
grpc = "1.84.0"
grpcKotlin = "1.5.0"
annotationsApi = "6.0.53"
desugarJdkLibs = "2.1.5"
lumo = "1.2.5"
okhttp = "4.12.0"
# The `2.1.0-` prefix IS the Kotlin version KSP is built against: it must move in
# lockstep with Kotlin. The `1.0.x` patch is the last line still shipping the KSP1
# task; `ksp.useKSP2=true` selects the KSP2 implementation instead.
ksp = "2.1.0-1.0.29"
# Dagger 2.57.1 supports KSP2 + Kotlin 2.1 without requiring Kotlin 2.2, and needs
# no Hilt (whose Gradle plugin hard-fails on the pure-JVM `:core:domain`/`:service`).
dagger = "2.57.1"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Compose artifacts Lumo's generated code imports (versions come from compose-bom).
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-util = { group = "androidx.compose.ui", name = "ui-util" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material-ripple = { group = "androidx.compose.material", name = "material-ripple" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobufJavaLite" }
protobuf-kotlin-lite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobufKotlinLite" }
protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protoc" }

grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
grpc-protobuf-lite = { group = "io.grpc", name = "grpc-protobuf-lite", version.ref = "grpc" }
grpc-kotlin-stub = { group = "io.grpc", name = "grpc-kotlin-stub", version.ref = "grpcKotlin" }
grpc-netty-shaded = { group = "io.grpc", name = "grpc-netty-shaded", version.ref = "grpc" }
grpc-inprocess = { group = "io.grpc", name = "grpc-inprocess", version.ref = "grpc" }
grpc-testing = { group = "io.grpc", name = "grpc-testing", version.ref = "grpc" }

# Read through the catalog API by `phonemanager.ksp`; `dagger` + `dagger-compiler`
# would nest as `libs.dagger.*` and shadow the leaf accessor.
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }

annotations-api = { group = "org.apache.tomcat", name = "annotations-api", version.ref = "annotationsApi" }
desugar_jdk_libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
protoc-gen-grpc-java = { group = "io.grpc", name = "protoc-gen-grpc-java", version.ref = "grpc" }
protoc-gen-grpc-kotlin = { group = "io.grpc", name = "protoc-gen-grpc-kotlin", version.ref = "grpcKotlin" }

# Plugin-build-only compile dependencies for `build-logic/convention`. These are
# the Gradle plugin APIs the convention plugins are compiled against; they are
# `compileOnly` there because the main build already supplies them at runtime.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradlePlugin = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
lumo = { id = "com.nomanr.plugin.lumo", version.ref = "lumo" }
# Applied by the `phonemanager.ksp` convention plugin; declared `apply false` in the
# root so the plugin lands on the main build's classpath exactly once.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# This repository's own convention plugins, provided by the `build-logic`
# composite build (see `pluginManagement { includeBuild("build-logic") }` in
# settings.gradle.kts). No version: the included build is always the source.
phonemanager-kotlin-library = { id = "phonemanager.kotlin.library" }
phonemanager-android-library = { id = "phonemanager.android.library" }
phonemanager-android-application = { id = "phonemanager.android.application" }
phonemanager-ktlint = { id = "phonemanager.ktlint" }
phonemanager-ksp = { id = "phonemanager.ksp" }
