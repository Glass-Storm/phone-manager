org.gradle.jvmargs=-Xmx4g
org.gradle.configuration-cache=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP2 is the supported implementation. KSP1 still runs at Kotlin 2.1.0 (verified),
# but it is deprecated and will not support Kotlin 2.2+ or AGP 9+, so KSP2 is the
# pinned target now.
ksp.useKSP2=true
